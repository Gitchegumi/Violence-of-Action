name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5-stable
  GODOT_DIR: /home/runner/.cache/godot-editor/4.5-stable
  GODOT_BIN: /home/runner/.cache/godot-editor/4.5-stable/godot
  GODOT_TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.5.stable

jobs:
  release-please:
    name: Create or update release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Export ${{ matrix.label }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            preset: Windows x86_64
            directory: windows
            output: ViolenceOfAction.exe
            archive_platform: windows-x86_64
          - label: Linux x86_64
            preset: Linux x86_64
            directory: linux
            output: ViolenceOfAction.x86_64
            archive_platform: linux-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore Godot editor cache
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-editor-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot 4.5
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.5-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-editor"
          mv "$RUNNER_TEMP/godot-editor/Godot_v4.5-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"

      - name: Restore export template cache
        id: templates-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$GODOT_TEMPLATES_DIR"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.5-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/export-templates.tpz"
          unzip -q "$RUNNER_TEMP/export-templates.tpz" \
            templates/version.txt \
            templates/windows_release_x86_64.exe \
            templates/linux_release.x86_64 \
            -d "$RUNNER_TEMP/export-templates"
          mv "$RUNNER_TEMP/export-templates/templates/"* "$GODOT_TEMPLATES_DIR/"

      - name: Import project
        run: "$GODOT_BIN --headless --path . --import"

      - name: Export release build
        shell: bash
        run: |
          mkdir -p "build/${{ matrix.directory }}"
          "$GODOT_BIN" --headless --path . --export-release \
            "${{ matrix.preset }}" \
            "build/${{ matrix.directory }}/${{ matrix.output }}"

      - name: Smoke-test Linux export
        if: matrix.archive_platform == 'linux-x86_64'
        shell: bash
        run: |
          chmod +x "build/${{ matrix.directory }}/${{ matrix.output }}"
          "build/${{ matrix.directory }}/${{ matrix.output }}" --headless --quit-after 5

      - name: Package export
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          PLATFORM: ${{ matrix.archive_platform }}
        run: |
          mkdir -p dist
          archive="violence-of-action-v$VERSION-$PLATFORM.zip"
          cd "build/${{ matrix.directory }}"
          zip -9 -r "../../dist/$archive" .

      - name: Upload packaged export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.archive_platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Attach builds to GitHub release
    needs:
      - release-please
      - build
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged exports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release upload "$TAG_NAME" ./*.zip SHA256SUMS.txt --clobber
